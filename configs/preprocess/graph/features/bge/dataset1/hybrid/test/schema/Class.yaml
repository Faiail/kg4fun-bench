general:
  device: cuda
  out_dir: data/raw/kg4fun/dataset1/splits/hybrid/test/graph/schema/bge_features
  node_info: Class
  pbar: true
data:
  name: FeatureTextDataset
  config:
    node_factory: data/raw/kg4fun/dataset1/splits/hybrid/test/graph/schema/entities/Class.csv
    properties: data/raw/kg4fun/dataset1/splits/hybrid/test/graph/schema/entity_properties.json
    qid_colname: class
loader:
  batch_size: 512
  num_workers: 4
model:
  name: HuggingfaceTextModel
  config:
    pretrained_model_name_or_path: &model BAAI/bge-base-en-v1.5
tokenizer:
  config:
    pretrained_model_name_or_path: *model
  kwargs:
    padding: true
    truncation: true
    max_length: 512
    return_tensors: pt
