general:
  out_dir: &out_dir models/text/complete/dedicated_roberta/dataset2/hybrid
  pbar: True
  num_epochs: 150
  warmup: 7
  metric_mult: -1
  metric_to_watch: f1
  device: cuda:1
  seed: 42
data:
  train:
    name: TextCompleteDataset
    config:
      dataset: data/raw/kg4fun/dataset2/splits/hybrid/train/edges/edge_component_mapping.json
      partition_dir: data/raw/kg4fun/dataset2/splits/hybrid/train/edges/partition
      node_info: data/raw/kg4fun/dataset2/splits/hybrid/train/node_info.json
      schema_node_info: data/raw/kg4fun/dataset2/splits/hybrid/train/node_types/summarization/qwen3-8b/node_type_info.json
      input_edge_info: data/raw/kg4fun/dataset2/splits/hybrid/train/edges/edge_info.json
      schema_edge_info: data/raw/kg4fun/dataset2/splits/hybrid/train/edge_types/summarization/qwen-8b/edge_type_info.json
  val:
    name: &val_cls ValTextCompleteDataset
    config:
      dataset: data/raw/kg4fun/dataset2/splits/hybrid/val/edges/edge_component_mapping.json
      partition_dir: data/raw/kg4fun/dataset2/splits/hybrid/val/edges/partition
      node_info: data/raw/kg4fun/dataset2/splits/hybrid/val/node_info.json
      schema_node_info: data/raw/kg4fun/dataset2/splits/hybrid/val/node_types/summarization/qwen3-8b/node_type_info.json
      input_edge_info: data/raw/kg4fun/dataset2/splits/hybrid/val/edges/edge_info.json
      schema_edge_info: data/raw/kg4fun/dataset2/splits/hybrid/val/edge_types/summarization/qwen-8b/edge_type_info.json
  test:
    name: *val_cls
    config:
      dataset: data/raw/kg4fun/dataset2/splits/hybrid/test/edges/edge_component_mapping.json
      partition_dir: data/raw/kg4fun/dataset2/splits/hybrid/test/edges/partition
      node_info: data/raw/kg4fun/dataset2/splits/hybrid/test/node_info.json
      schema_node_info: data/raw/kg4fun/dataset2/splits/hybrid/test/node_types/summarization/qwen3-8b/node_type_info.json
      input_edge_info: data/raw/kg4fun/dataset2/splits/hybrid/test/edges/edge_info.json
      schema_edge_info: data/raw/kg4fun/dataset2/splits/hybrid/test/edge_types/summarization/qwen-8b/edge_type_info.json
loader:
  batch_size: 512
  shuffle: True
  drop_last: False
  num_workers: 8
model:
  name: DedicatedCompleteTextEncoder
  config:
    bbone_config:
      pretrained_model_name_or_path: &model roberta-base
    bbone_hidden_size: 768
    final_hidden_size: 512
tokenizer:
  config:
    pretrained_model_name_or_path: *model
  kwargs:
    truncation: True
    return_tensors: pt
    padding: True
criterion:
  name: CompleteLoss
  config:
    keys: [head, rel, tail]
    base_loss_name: InfoNCELoss
    base_loss_kwargs:
      temperature: 0.045
      learnable: True
optimizer:
  name: AdamW
  config:
    lr: 5e-5
early_stop:
  name: EarlyStopping
  config:
    verbose: True
    patience: 10
    path: model.pt
scheduler:
  name: HuggingFaceCosineScheduler  
  config: 
    num_warmup_steps: 1731
metrics:
  nodes:
    precision:
      name: Precision
      config:
        average: macro
        task: &task multiclass
        num_classes: 440
    recall:
      name: Recall
      config:
        average: macro
        task: *task
        num_classes: 440
    f1:
      name: F1Score
      config:
        average: macro
        task: *task
        num_classes: 440
  edges:
    precision:
      name: Precision
      config:
        average: macro
        task: &task multiclass
        num_classes: 440
    recall:
      name: Recall
      config:
        average: macro
        task: *task
        num_classes: 440
    f1:
      name: F1Score
      config:
        average: macro
        task: *task
        num_classes: 440