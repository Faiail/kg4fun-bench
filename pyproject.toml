[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "src"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Raffaele Scaringi" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "accelerate>=1.13.0",
    "bitsandbytes>=0.49.2",
    "deeponto>=0.9.3",
    "einops>=0.8.2",
    "jupyter>=1.1.1",
    "loguru",
    "matplotlib>=3.11.1",
    "mkdocs",
    "networkx>=3.6.1",
    "ontospy>=2.1.1",
    "openai>=2.37.0",
    "owlready2>=0.50",
    "pip",
    "pivottablejs>=0.9.0",
    "protobuf>=7.35.0",
    "python-dotenv",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.5",
    "rdflib>=7.6.0",
    "ruamel-yaml>=0.19.1",
    "ruff",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.5.1",
    "sentencepiece>=0.2.1",
    "torch>=2.12.0",
    "torchmetrics>=1.9.0",
    "tqdm",
    "transformers>=5.9.0",
    "typer",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true

